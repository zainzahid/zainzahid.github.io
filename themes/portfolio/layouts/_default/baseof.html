<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    {{ $description := .Site.Params.description }}
    {{ with .Site.GetPage "/about" }}{{ if not $description }}{{ $description = .Params.description }}{{ end }}{{ end }}

    <title>{{ .Site.Title }}</title>
    <meta content="{{ $description }}" name="description" />
    <meta content="{{ .Site.Params.keywords }}" name="keywords" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ .Site.Title }}" />
    <meta property="og:description" content="{{ $description }}" />
    <meta property="og:image" content="{{ "assets/about.png" | absURL }}" />
    <meta property="og:url" content="{{ .Site.BaseURL }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ .Site.Title }}" />
    <meta name="twitter:description" content="{{ $description }}" />
    <meta name="twitter:image" content="{{ "assets/about.png" | absURL }}" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="{{ "assets/favicon.svg" | relURL }}" />

    <!-- Preload primary font so it's not delayed behind vendor CSS -->
    <link
      rel="preload"
      href="{{ "assets/SpaceGrotesk.ttf" | relURL }}"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <!-- Vendor CSS Files -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    {{ partial "head.html" . }}
  </head>

  <body>
    <a class="skip-link" href="#about">Skip to content</a>
    {{ block "main" . }}{{ end }}

    <!-- Vendor JS Files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/typed.js/2.0.12/typed.min.js"></script>

    {{ partial "footer.html" . }}
  </body>
</html>
